<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07553d">
  <meta name="description" content="Crea, descarga y conserva códigos QR desde tu celular.">
  <title>ScanGoQR</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" data-go="home" aria-label="Inicio"><span class="brand-mark">⌁</span><span>ScanGoQR</span></a>
    <button id="installBtn" class="icon-btn" hidden aria-label="Instalar aplicación" title="Instalar">⇩</button>
  </header>

  <main class="shell">
    <section id="home" class="view active">
      <div class="hero">
        <span class="eyebrow">CREA · ESCANEA · COMPARTE</span>
        <h1>ScanGoQR</h1>
        <p>Convierte texto o enlaces en códigos QR.</p>
        <span class="spark">✦</span>
      </div>
      <button class="menu-card" data-go="create">
        <span class="round-icon">▦</span><span><strong>Generar QR</strong><small>Texto o enlace web</small></span><b>›</b>
      </button>
      <button class="menu-card" data-go="saved">
        <span class="round-icon">⌑</span><span><strong>Mis QR</strong><small>Guardados y protegidos</small></span><b>›</b>
      </button>
      <p class="version">Versión 0.1.1</p>
    </section>

    <section id="create" class="view">
      <div class="section-title"><button class="back" data-go="home" aria-label="Regresar">‹</button><div><h2>Generar QR</h2><p>Selecciona qué deseas convertir</p></div></div>
      <div id="typeChooser" class="type-grid">
        <button class="type-card" data-type="text"><span>𝐓</span><strong>Texto</strong><small>Mensaje, dato o nota</small></button>
        <button class="type-card" data-type="url"><span>🔗</span><strong>URL</strong><small>Página o enlace web</small></button>
      </div>
      <form id="qrForm" class="panel" hidden>
        <label id="inputLabel" for="qrValue">Contenido</label>
        <textarea id="qrValue" maxlength="1200" rows="5" placeholder="Escribe aquí…" required></textarea>
        <p id="formError" class="error" role="alert"></p>
        <div class="actions"><button type="button" class="secondary" id="changeType">Cambiar tipo</button><button class="primary">Generar vista previa</button></div>
      </form>
      <section id="previewPanel" class="panel preview" hidden>
        <div class="qr-frame"><canvas id="previewCanvas"></canvas></div>
        <span id="previewType" class="badge"></span>
        <p id="previewText" class="preview-text"></p>
        <button id="saveQR" class="primary wide">Guardar en Mis QR</button>
        <div class="download-row"><button id="downloadJpg" class="secondary">Descargar JPEG</button><button id="downloadPdf" class="secondary">Descargar PDF</button></div>
        <p id="pdfHint" class="hint"></p>
      </section>
    </section>

    <section id="saved" class="view">
      <div class="section-title"><button class="back" data-go="home" aria-label="Regresar">‹</button><div><h2>Mis QR</h2><p>Los no protegidos duran 24 horas</p></div></div>
      <div id="savedList" class="saved-list"></div>
      <div id="emptyState" class="empty"><span>▦</span><h3>Aún no hay códigos QR</h3><p>Genera uno y guárdalo para verlo aquí.</p><button class="primary" data-go="create">Generar QR</button></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="vendor/qrcode.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
